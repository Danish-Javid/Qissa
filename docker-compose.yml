# Two services, one command: `docker compose up --build`.
# The app image is built from the single Dockerfile at the repo root of app/.
# Secrets come from .env (never committed); DATABASE_URL is overridden here
# because inside the compose network the database host is "db", not localhost.

services:
  app:
    build:
      context: .
      # PINNED, and it matters. A bare `build: .` uses the LAST stage in the
      # Dockerfile, so adding the render-capable `runtime-video` stage at the
      # end silently switched this service from alpine to bookworm-slim --
      # a wider attack surface, adopted by accident rather than by decision.
      # Naming the target means a new stage can never move this again.
      #
      # For personalized video, layer the override instead:
      #   docker compose -f docker-compose.yml -f docker-compose.video.yml up --build
      target: runtime
    ports:
      # LOCAL DEVELOPMENT ONLY. Do not publish this port on an internet-reachable
      # host: there is no TLS and no reverse proxy in front of an app that
      # handles children's voice data. Use docker-compose.prod.yml (Caddy as the
      # sole ingress) for anything public.
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Override .env: within the compose network PostgreSQL is reachable as "db".
      # The password comes from the environment with a local-only fallback, so
      # this file carries no literal credential and a real deployment cannot
      # inherit one by copy-paste. Set POSTGRES_PASSWORD for anything shared.
      DATABASE_URL: postgresql://qissa:${POSTGRES_PASSWORD:-qissa}@db:5432/qissa?schema=public
    volumes:
      # Child audio clips + generated illustrations persist across rebuilds,
      # and the retention job prunes them on schedule.
      - qissa-data:/srv/qissa/data-runtime
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qissa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qissa}
      POSTGRES_DB: qissa
    volumes:
      - qissa-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qissa -d qissa"]
      interval: 5s
      timeout: 3s
      retries: 10
    # The database is internal-only: no host port is published.

volumes:
  qissa-data:
  qissa-db:
